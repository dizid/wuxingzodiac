[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allowlist reflects the site's actual external resources:
    # Google Fonts (stylesheet + font files), GA4/gtag (script + beacon),
    # Promoten affiliate tracking (script + beacon). Stripe checkout is a
    # full-page redirect (window.location), not an embed, so it needs no entry.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://promoten.pro; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://promoten.pro; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback: pre-rendered pages serve static HTML, unknown routes get index.html (shows 404 page)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
