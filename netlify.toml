[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

# Personalized reading generator: Playwright + Lambda-compatible Chromium.
# Shipped as node_modules (not bundled by esbuild). chromium-min downloads the
# Chromium pack at cold start — see src/lib/readings/server/render-pdf.ts.
[functions."generate-reading-background"]
  external_node_modules = ["@sparticuz/chromium-min", "playwright-core"]

# "Step into your element" video: Genie 4 frames -> MP4 with the ffmpeg binary from
# ffmpeg-static (~80 MB, ~29 MB zipped). Shipped as node_modules so the binary sits
# next to the package's index.js (src/lib/element-video/server/media.ts finds it, and
# copies it to /tmp with +x if the zip lost the executable bit).
[functions."element-video-background"]
  external_node_modules = ["ffmpeg-static"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allowlist reflects the site's actual external resources:
    # Google Fonts (stylesheet + font files), GA4/gtag (script + beacon).
    # Stripe checkout is a full-page redirect (window.location), not an embed,
    # so it needs no entry. (Promoten, the archived affiliate tracker, was
    # removed Nov 11 2026.)
    # GA4 hosts are the ones gtag.js for G-5M7CY55LL8 actually sends to. It uses
    # fetch/sendBeacon (connect-src) and falls back to an image pixel (img-src):
    # *.google-analytics.com + (*.)analytics.google.com (hits; the bare host is
    # not matched by the wildcard), www.google.com (/g/collect retry when a hit
    # fails), stats.g.doubleclick.net and www.google.co.th (Google Signals;
    # .co.th is the property's ads domain).
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://www.google.co.th https://stats.g.doubleclick.net; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# There is no shop: old /shop links go to the personal reading page.
# Listed before the SPA fallback (first match wins); force in case a stale shop.html is ever deployed.
[[redirects]]
  from = "/shop"
  to = "/reading"
  status = 301
  force = true

[[redirects]]
  from = "/shop/*"
  to = "/reading"
  status = 301
  force = true

# SPA fallback, only where a valid page may have no prerendered file (static files
# win, these rules are not forced):
# - /compatibility/<b>/<a>: reverse-order pair links; the router redirects to the
#   alphabetical page that is prerendered
# - /blog/<slug>: a post added to the database after the last build renders in the browser
# Every other unknown URL gets dist/404.html with a real 404 status (Netlify's default),
# so Google no longer sees junk URLs as copies of the home page (soft 404).
[[redirects]]
  from = "/compatibility/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200
